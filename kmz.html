<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PNG / GeoTIFF to KMZ</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Noto Sans JP", sans-serif;
      color: #202020;
      background: #f3f3f3;
    }

    * {
      box-sizing: border-box;
    }

    body {
      max-width: 860px;
      margin: 0 auto;
      padding: 32px 20px 56px;
    }

    a {
      color: #303030;
    }

    h1 {
      margin: 24px 0 8px;
      font-size: 1.8rem;
    }

    .intro {
      margin: 0 0 28px;
      color: #555;
      line-height: 1.7;
    }

    .panel {
      border: 1px solid #999;
      background: #fff;
      padding: 24px;
    }

    .drop-zone {
      display: block;
      padding: 28px 16px;
      border: 2px dashed #888;
      text-align: center;
      cursor: pointer;
      background: #fafafa;
    }

    .drop-zone.is-dragging {
      border-color: #111;
      background: #ededed;
    }

    .drop-zone input {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      clip-path: inset(50%);
    }

    .drop-title {
      display: block;
      font-weight: 700;
    }

    .drop-hint,
    .help {
      display: block;
      margin-top: 6px;
      color: #666;
      font-size: 0.88rem;
    }

    #file-name,
    #world-file-name {
      margin: 10px 0 0;
      overflow-wrap: anywhere;
      color: #444;
      font-size: 0.9rem;
    }

    .options {
      margin-top: 24px;
      padding-top: 22px;
      border-top: 1px solid #ccc;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 1.15rem;
    }

    .coordinates {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-top: 18px;
    }

    .field label {
      display: block;
      margin-bottom: 5px;
      font-size: 0.9rem;
    }

    input[type="number"] {
      width: 100%;
      min-height: 42px;
      padding: 8px 10px;
      border: 1px solid #888;
      border-radius: 0;
      background: #fff;
      color: inherit;
      font: inherit;
    }

    .button {
      min-height: 44px;
      margin-top: 22px;
      padding: 10px 20px;
      border: 1px solid #222;
      border-radius: 0;
      background: #222;
      color: #fff;
      font: inherit;
      cursor: pointer;
    }

    .button:disabled {
      border-color: #aaa;
      background: #aaa;
      cursor: not-allowed;
    }

    #status {
      min-height: 1.5em;
      margin: 14px 0 0;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    #status[data-error="true"] {
      color: #a00000;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 560px) {
      body {
        padding: 20px 14px 40px;
      }

      .panel {
        padding: 18px;
      }

      .coordinates {
        grid-template-columns: 1fr;
      }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/geotiff@2.1.3/dist-browser/geotiff.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/proj4@2.11.0/dist/proj4.js" defer></script>
  <script defer>
    document.addEventListener("DOMContentLoaded", function () {
      const fileInput = document.getElementById("raster-file");
      const worldFileInput = document.getElementById("world-file");
      const worldSection = document.getElementById("world-section");
      const coordinateSection = document.getElementById("coordinate-section");
      const worldDrop = document.getElementById("world-drop");
      const fileName = document.getElementById("file-name");
      const worldFileName = document.getElementById("world-file-name");
      const generateButton = document.getElementById("generate");
      const status = document.getElementById("status");
      let selectedFile = null;
      let selectedWorldFile = null;

      function showStatus(message, isError) {
        status.textContent = message;
        status.dataset.error = isError ? "true" : "false";
      }

      function fileKind(file) {
        const name = file.name.toLowerCase();
        if (file.type === "image/png" || name.endsWith(".png")) return "png";
        if (name.endsWith(".tif") || name.endsWith(".tiff") || file.type === "image/tiff") return "tiff";
        return null;
      }

      function setSelectedFile(file) {
        const kind = fileKind(file);
        selectedWorldFile = null;
        worldFileInput.value = "";
        worldFileName.textContent = "";
        document.getElementById("clear-world-file").hidden = true;
        if (!kind) {
          selectedFile = null;
          generateButton.disabled = true;
          fileName.textContent = "";
          worldSection.hidden = true;
          coordinateSection.hidden = true;
          showStatus("PNG または GeoTIFF（.tif / .tiff）を選択してください。", true);
          return;
        }

        selectedFile = file;
        generateButton.disabled = false;
        fileName.textContent = file.name;
        worldSection.hidden = kind !== "png";
        coordinateSection.hidden = kind !== "png" || Boolean(selectedWorldFile);
        showStatus(kind === "tiff"
          ? "GeoTIFFの座標情報を読み取り、KMZを自動生成します。"
          : "頂点座標を入力するか、world fileを追加してください。", false);
        if (kind === "tiff") generateButton.click();
      }

      function setWorldFile(file) {
        if (!file) return;
        selectedWorldFile = file;
        worldFileName.textContent = file.name;
        coordinateSection.hidden = true;
        document.getElementById("clear-world-file").hidden = false;
        showStatus("world fileを使用します。", false);
      }

      function connectDropZone(zone, onFile) {
        zone.addEventListener("dragover", function (event) {
          event.preventDefault();
          zone.classList.add("is-dragging");
        });
        zone.addEventListener("dragleave", function () {
          zone.classList.remove("is-dragging");
        });
        zone.addEventListener("drop", function (event) {
          event.preventDefault();
          zone.classList.remove("is-dragging");
          const file = event.dataTransfer.files[0];
          if (file) onFile(file);
        });
      }

      connectDropZone(document.getElementById("raster-drop"), setSelectedFile);
      connectDropZone(worldDrop, setWorldFile);
      fileInput.addEventListener("change", function () {
        if (fileInput.files[0]) setSelectedFile(fileInput.files[0]);
      });
      worldFileInput.addEventListener("change", function () {
        if (worldFileInput.files[0]) setWorldFile(worldFileInput.files[0]);
      });
      document.getElementById("clear-world-file").addEventListener("click", function () {
        selectedWorldFile = null;
        worldFileInput.value = "";
        worldFileName.textContent = "";
        document.getElementById("clear-world-file").hidden = true;
        coordinateSection.hidden = !selectedFile || fileKind(selectedFile) !== "png";
        showStatus("頂点座標を入力してください。", false);
      });

      function validBounds(bounds) {
        const values = [bounds.north, bounds.south, bounds.east, bounds.west];
        if (!values.every(Number.isFinite)
          || bounds.north > 90 || bounds.south < -90
          || bounds.east > 180 || bounds.west < -180
          || bounds.north <= bounds.south || bounds.east <= bounds.west) {
          throw new Error("緯度・経度の範囲を確認してください（北 > 南、東 > 西）。");
        }
        return bounds;
      }

      function readCoordinateBounds() {
        const bounds = {};
        ["north", "south", "east", "west"].forEach(function (key) {
          const input = document.getElementById(key);
          if (input.value.trim() === "") throw new Error("緯度・経度をすべて入力してください。");
          bounds[key] = Number(input.value);
        });
        return validBounds(bounds);
      }

      async function readWorldFile(file, width, height) {
        const lines = (await file.text()).trim().split(/\s+/).map(Number);
        if (lines.length !== 6 || !lines.every(Number.isFinite)) {
          throw new Error("world fileは数値6行（A, D, B, E, C, F）の形式で指定してください。");
        }
        const [a, d, b, e, c, f] = lines;
        const corners = [
          [-0.5, -0.5],
          [width - 0.5, -0.5],
          [-0.5, height - 0.5],
          [width - 0.5, height - 0.5]
        ].map(function (point) {
          return {
            longitude: a * point[0] + b * point[1] + c,
            latitude: d * point[0] + e * point[1] + f
          };
        });
        return validBounds({
          north: Math.max.apply(null, corners.map(function (point) { return point.latitude; })),
          south: Math.min.apply(null, corners.map(function (point) { return point.latitude; })),
          east: Math.max.apply(null, corners.map(function (point) { return point.longitude; })),
          west: Math.min.apply(null, corners.map(function (point) { return point.longitude; }))
        });
      }

      function escapeXml(value) {
        return value.replace(/[&<>"']/g, function (character) {
          return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            "\"": "&quot;",
            "'": "&apos;"
          }[character];
        });
      }

      function createKml(imageName, bounds) {
        function coordinate(value) {
          return Number(value.toFixed(10)).toString();
        }
        return '<?xml version="1.0" encoding="UTF-8"?>\n'
          + '<kml xmlns="http://www.opengis.net/kml/2.2"><Document>'
          + "<name>" + escapeXml(imageName) + "</name>"
          + "<GroundOverlay><name>" + escapeXml(imageName) + "</name><Icon><href>"
          + escapeXml(encodeURIComponent(imageName)) + "</href></Icon><LatLonBox>"
          + "<north>" + coordinate(bounds.north) + "</north><south>" + coordinate(bounds.south) + "</south>"
          + "<east>" + coordinate(bounds.east) + "</east><west>" + coordinate(bounds.west) + "</west>"
          + "</LatLonBox></GroundOverlay></Document></kml>";
      }

      async function pngFromGeoTiff(file) {
        if (typeof GeoTIFF === "undefined" || typeof proj4 === "undefined") {
          throw new Error("GeoTIFF変換ライブラリを読み込めません。ネットワーク接続を確認して再読み込みしてください。");
        }
        const tiff = await GeoTIFF.fromBlob(file);
        const image = await tiff.getImage();
        const width = image.getWidth();
        const height = image.getHeight();
        const geoKeys = image.getGeoKeys();
        const epsg = geoKeys.ProjectedCSTypeGeoKey || geoKeys.GeographicTypeGeoKey;
        if (!epsg) throw new Error("GeoTIFFにEPSG座標系情報がありません。");

        let sourceCrs = "EPSG:" + epsg;
        if (epsg >= 32601 && epsg <= 32660) {
          sourceCrs = "+proj=utm +zone=" + (epsg - 32600) + " +datum=WGS84 +units=m +no_defs +type=crs";
        } else if (epsg >= 32701 && epsg <= 32760) {
          sourceCrs = "+proj=utm +zone=" + (epsg - 32700) + " +south +datum=WGS84 +units=m +no_defs +type=crs";
        } else if (epsg !== 4326 && epsg !== 3857) {
          throw new Error("未対応のEPSG:" + epsg + "です。対応座標系はEPSG:4326、3857、32601-32660、32701-32760です。");
        }

        const box = image.getBoundingBox();
        if (!box || box.length !== 4 || !box.every(Number.isFinite)) {
          throw new Error("GeoTIFFの画像範囲を読み取れません。");
        }
        const corners = [[box[0], box[1]], [box[0], box[3]], [box[2], box[1]], [box[2], box[3]]]
          .map(function (point) { return proj4(sourceCrs, "EPSG:4326", point); });
        const bounds = validBounds({
          west: Math.min.apply(null, corners.map(function (point) { return point[0]; })),
          east: Math.max.apply(null, corners.map(function (point) { return point[0]; })),
          south: Math.min.apply(null, corners.map(function (point) { return point[1]; })),
          north: Math.max.apply(null, corners.map(function (point) { return point[1]; }))
        });

        const maxPixels = 16000000;
        const scale = Math.min(1, Math.sqrt(maxPixels / (width * height)));
        const outputWidth = Math.max(1, Math.round(width * scale));
        const outputHeight = Math.max(1, Math.round(height * scale));
        const rasters = await image.readRasters({
          width: outputWidth,
          height: outputHeight,
          interleave: true
        });
        const samples = image.getSamplesPerPixel();
        if (samples < 1) throw new Error("GeoTIFFに画像バンドがありません。");

        const canvas = document.createElement("canvas");
        canvas.width = outputWidth;
        canvas.height = outputHeight;
        const context = canvas.getContext("2d");
        const imageData = context.createImageData(outputWidth, outputHeight);
        const values = rasters;
        const bitsPerSample = image.getBitsPerSample();
        const limits = [];
        for (let band = 0; band < samples; band++) {
          if (rasters instanceof Float32Array || rasters instanceof Float64Array) {
            let min = Infinity;
            let max = -Infinity;
            for (let index = band; index < values.length; index += samples) {
              const value = values[index];
              if (Number.isFinite(value)) {
                min = Math.min(min, value);
                max = Math.max(max, value);
              }
            }
            limits.push([min, max]);
          } else {
            const bits = bitsPerSample[Math.min(band, bitsPerSample.length - 1)] || 8;
            limits.push([0, Math.pow(2, Math.min(bits, 32)) - 1]);
          }
        }

        function channel(value, band) {
          const limit = limits[band];
          if (!Number.isFinite(value) || !Number.isFinite(limit[0]) || limit[1] <= limit[0]) return 0;
          return Math.max(0, Math.min(255, Math.round((value - limit[0]) * 255 / (limit[1] - limit[0]))));
        }

        for (let pixel = 0; pixel < outputWidth * outputHeight; pixel++) {
          const sourceIndex = pixel * samples;
          const targetIndex = pixel * 4;
          if (samples === 1 || samples === 2) {
            const gray = channel(values[sourceIndex], 0);
            imageData.data[targetIndex] = gray;
            imageData.data[targetIndex + 1] = gray;
            imageData.data[targetIndex + 2] = gray;
            imageData.data[targetIndex + 3] = samples === 2
              ? channel(values[sourceIndex + 1], 1)
              : 255;
          } else {
            imageData.data[targetIndex] = channel(values[sourceIndex], 0);
            imageData.data[targetIndex + 1] = channel(values[sourceIndex + 1], 1);
            imageData.data[targetIndex + 2] = channel(values[sourceIndex + 2], 2);
            imageData.data[targetIndex + 3] = samples >= 4 ? channel(values[sourceIndex + 3], 3) : 255;
          }
        }
        context.putImageData(imageData, 0, 0);
        const blob = await new Promise(function (resolve) {
          canvas.toBlob(resolve, "image/png");
        });
        if (!blob) throw new Error("GeoTIFF画像をPNGに変換できませんでした。");
        return { blob: blob, bounds: bounds };
      }

      generateButton.addEventListener("click", async function () {
        if (!selectedFile) return;
        if (typeof JSZip === "undefined") {
          showStatus("KMZ生成ライブラリを読み込めません。ネットワーク接続を確認して再読み込みしてください。", true);
          return;
        }
        const rasterFile = selectedFile;
        generateButton.disabled = true;
        showStatus("KMZを生成しています…", false);
        try {
          const kind = fileKind(rasterFile);
          let imageBlob = rasterFile;
          let imageName = rasterFile.name;
          let bounds;
          if (kind === "png") {
            const image = await createImageBitmap(rasterFile);
            bounds = selectedWorldFile
              ? await readWorldFile(selectedWorldFile, image.width, image.height)
              : readCoordinateBounds();
            image.close();
          } else {
            const result = await pngFromGeoTiff(rasterFile);
            imageBlob = result.blob;
            imageName = rasterFile.name.replace(/\.(tif|tiff)$/i, "") + ".png";
            bounds = result.bounds;
          }

          const zip = new JSZip();
          zip.file("doc.kml", createKml(imageName, bounds));
          zip.file(imageName, imageBlob);
          const kmz = await zip.generateAsync({ type: "blob", compression: "DEFLATE" });
          const url = URL.createObjectURL(kmz);
          const link = document.createElement("a");
          link.href = url;
          link.download = rasterFile.name.replace(/\.(png|tif|tiff)$/i, "") + ".kmz";
          document.body.appendChild(link);
          link.click();
          link.remove();
          window.setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
          showStatus("KMZを生成しました。", false);
        } catch (error) {
          showStatus(error.message || "KMZの生成に失敗しました。", true);
        } finally {
          generateButton.disabled = false;
        }
      });
    });
  </script>
</head>
<body>
  <a href="./index.html">Tools</a>
  <h1>PNG / GeoTIFF to KMZ</h1>
  <p class="intro">PNGと位置情報, またはGeoTIFFからGoogle Earth用のKMZを作成します. GeoTIFFは選択すると自動で変換します. EPSG:4326 / 3857 と WGS84 UTM（32601–32660、32701–32760）に対応しています. 画像ファイルはサーバーに送信されずブラウザー内で処理されます.</p>

  <main class="panel">
    <label class="drop-zone" id="raster-drop" for="raster-file">
      <input id="raster-file" type="file" accept=".png,.tif,.tiff,image/png,image/tiff">
      <span class="drop-title">PNG または GeoTIFF を選択 / ドロップ</span>
      <span class="drop-hint">対応形式: .png, .tif, .tiff</span>
    </label>
    <p id="file-name" aria-live="polite"></p>

    <section class="options" id="world-section" hidden>
      <h2>PNGの位置情報</h2>
      <label class="drop-zone" id="world-drop" for="world-file">
        <input id="world-file" type="file" accept=".pgw,.wld,.jgw,.tfw,.txt">
        <span class="drop-title">world fileを選択 / ドロッ (任意)</span>
        <span class="drop-hint">.pgw, .wld などの6行形式 (WGS84)</span>
      </label>
      <p id="world-file-name" aria-live="polite"></p>
      <button class="button" id="clear-world-file" type="button" hidden>world fileを解除して座標入力に切替</button>
    </section>

    <section class="options" id="coordinate-section" hidden>
      <h2>PNGの頂点座標</h2>
      <span class="help">画像の四隅を囲む緯度・経度(十進法)を入力してください.</span>
      <div class="coordinates">
        <div class="field"><label for="north">北端の緯度</label><input id="north" type="number" step="any" placeholder="例: 35.7"></div>
        <div class="field"><label for="south">南端の緯度</label><input id="south" type="number" step="any" placeholder="例: 35.6"></div>
        <div class="field"><label for="east">東端の経度</label><input id="east" type="number" step="any" placeholder="例: 139.8"></div>
        <div class="field"><label for="west">西端の経度</label><input id="west" type="number" step="any" placeholder="例: 139.6"></div>
      </div>
    </section>

    <button class="button" id="generate" type="button" disabled>KMZを生成</button>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
